apiVersion: v1
kind: Namespace
metadata:
  name: spark-livy

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-config
  namespace: spark-livy
data:
  spark-defaults.conf: |
    spark.master                     spark://localhost:7077
    spark.eventLog.enabled           true
    spark.eventLog.dir               /tmp/spark-events
    spark.history.fs.logDirectory    /tmp/spark-events
    spark.driver.memory              4g
    spark.executor.memory            4g
    spark.executor.cores             2

---
apiVersion: v1
kind: Service
metadata:
  name: spark-livy-service
  namespace: spark-livy
spec:
  type: ClusterIP
  ports:
    - name: livy-api
      port: 8998
      targetPort: 8998
      protocol: TCP
    - name: spark-master
      port: 7077
      targetPort: 7077
      protocol: TCP
    - name: spark-ui
      port: 6066
      targetPort: 6066
      protocol: TCP
  selector:
    app: spark-livy

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-livy
  namespace: spark-livy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-livy
  template:
    metadata:
      labels:
        app: spark-livy
    spec:
      containers:
      - name: spark-livy
        image: spark-livy:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8998
          name: livy-api
        - containerPort: 7077
          name: spark-master
        - containerPort: 6066
          name: spark-ui
        env:
        - name: SPARK_MASTER_WEBUI_PORT
          value: "6066"
        - name: SPARK_LOCAL_IP
          value: "spark-livy-service"
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /sessions
            port: 8998
          initialDelaySeconds: 40
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /sessions
            port: 8998
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - name: spark-config
          mountPath: /opt/spark/conf
          readOnly: true
      volumes:
      - name: spark-config
        configMap:
          name: spark-config
