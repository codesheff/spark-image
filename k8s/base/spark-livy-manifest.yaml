apiVersion: v1
kind: Namespace
metadata:
  name: spark-livy

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-livy-sa
  namespace: spark-livy

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spark-livy-role
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "pods/status"]
  verbs: ["create", "delete", "get", "watch", "list"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["create", "delete", "get", "watch", "list"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create", "delete", "get", "watch", "list"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "get", "list", "watch"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["persistentvolumes"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "create", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spark-livy-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spark-livy-role
subjects:
- kind: ServiceAccount
  name: spark-livy-sa
  namespace: spark-livy

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-driver-pod-template
  namespace: spark-livy
data:
  driver-pod-template.yaml: |
    apiVersion: v1
    kind: Pod
    spec:
      containers:
      - name: spark-driver
        image: stedoh/spark-livy:latest
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - name: spark-events
          mountPath: /tmp/spark-events
      volumes:
      - name: spark-events
        emptyDir: {}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-executor-pod-template
  namespace: spark-livy
data:
  executor-pod-template.yaml: |
    apiVersion: v1
    kind: Pod
    spec:
      containers:
      - name: spark-executor
        image: stedoh/spark-livy:latest
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - name: spark-events
          mountPath: /tmp/spark-events
      volumes:
      - name: spark-events
        emptyDir: {}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-config
  namespace: spark-livy
data:
  spark-defaults.conf: |
    # Kubernetes scheduler backend
    spark.master                     k8s://https://kubernetes.default.svc:443
    spark.kubernetes.namespace       spark-livy
    spark.kubernetes.authenticate.driver.mounted.caCertFile  /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    spark.kubernetes.authenticate.driver.mounted.oauthTokenFile  /var/run/secrets/kubernetes.io/serviceaccount/token
    
    # Container image for Spark drivers and executors
    spark.kubernetes.container.image stedoh/spark-livy:latest
    spark.kubernetes.container.image.pullPolicy IfNotPresent
    
    # Driver configuration
    spark.kubernetes.driver.pod.name spark-driver
    spark.kubernetes.driver.request.cores 1000m
    spark.kubernetes.driver.limit.cores 2000m
    spark.driver.memory              2g
    spark.driver.memoryOverhead      1g
    
    # Executor configuration
    spark.executor.instances         2
    spark.executor.cores             1
    spark.executor.memory            2g
    spark.executor.memoryOverhead    1g
    spark.kubernetes.executor.request.cores 1000m
    spark.kubernetes.executor.limit.cores   2000m
    
    # Volume mounts
    spark.kubernetes.driver.volumes.emptyDir.spark-events.mount.path /tmp/spark-events
    spark.kubernetes.executor.volumes.emptyDir.spark-events.mount.path /tmp/spark-events
    
    # Event logging
    spark.eventLog.enabled           true
    spark.eventLog.dir               /tmp/spark-events
    
    # Logging
    spark.log.callerContext          LivyK8sApp

---
apiVersion: v1
kind: Service
metadata:
  name: spark-livy-service
  namespace: spark-livy
spec:
  type: ClusterIP
  ports:
    - name: livy-api
      port: 8998
      targetPort: 8998
      protocol: TCP
    - name: spark-master
      port: 7077
      targetPort: 7077
      protocol: TCP
    - name: spark-ui
      port: 6066
      targetPort: 6066
      protocol: TCP
  selector:
    app: spark-livy

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-livy
  namespace: spark-livy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-livy
  template:
    metadata:
      labels:
        app: spark-livy
    spec:
      serviceAccountName: spark-livy-sa
      containers:
      - name: spark-livy
        image: stedoh/spark-livy:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8998
          name: livy-api
        - containerPort: 7077
          name: spark-master
        - containerPort: 6066
          name: spark-ui
        env:
        - name: SPARK_MODE
          value: "kubernetes"
        - name: KUBERNETES_MASTER
          value: "https://kubernetes.default.svc:443"
        - name: SPARK_LOCAL_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: SPARK_DRIVER_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /sessions
            port: 8998
          initialDelaySeconds: 40
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /sessions
            port: 8998
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - name: spark-config
          mountPath: /opt/spark/conf
          readOnly: true
        - name: spark-events
          mountPath: /tmp/spark-events
        - name: pod-templates
          mountPath: /opt/spark/templates
          readOnly: true
      volumes:
      - name: spark-config
        configMap:
          name: spark-config
      - name: spark-events
        emptyDir: {}
      - name: pod-templates
        projected:
          sources:
          - configMap:
              name: spark-driver-pod-template
          - configMap:
              name: spark-executor-pod-template
