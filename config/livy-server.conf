# Livy Server Configuration
# See: http://livy.incubator.apache.org/docs/latest/rest-api.html

# Livy Server port
livy.server.port=8998

# Livy Server address
livy.server.host=0.0.0.0

# Livy Server UI enabled
livy.ui.enabled=true

# Session timeout (in hours)
livy.server.session.timeout=24h

# CSRF Protection
livy.server.csrf-protection.enabled=true

# Impersonation
livy.impersonation.enabled=false

# Spark configuration
# livy.spark.scala-shell.classPath=

# Enable Kerberos if needed
# livy.server.auth.type=kerberos
# livy.server.auth.kerberos.principal=livy/hostname@REALM
# livy.server.auth.kerberos.keytab=/path/to/livy.keytab

# Logging
livy.server.request_log_enabled=true
